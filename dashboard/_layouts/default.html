<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: site.title }} | {{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: 'Documentation for the Modular Monolith E-commerce backend portfolio project.' }}">
  <script>
    (function () {
      try {
        document.documentElement.dataset.theme = localStorage.getItem("portfolio-dashboard-theme") || "dark";
      } catch {
        document.documentElement.dataset.theme = "dark";
      }
    })();
  </script>
  <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
</head>
<body class="docs-page">
<a class="skip-link" href="#main-content">Skip to content</a>

<header class="topbar">
  <div class="wrap topbar-inner">
    <a class="brand" href="{{ '/' | relative_url }}">Modular Monolith E-commerce</a>
    <nav class="nav" aria-label="Documentation navigation">
      <a href="{{ '/docs/' | relative_url }}">Docs index</a>
      <a href="{{ '/docs/user-guide.html' | relative_url }}">User guide</a>
      <a href="{{ '/openapi/' | relative_url }}">OpenAPI</a>
      <button class="theme-toggle" type="button" data-theme-toggle aria-label="Switch to light mode">Light mode</button>
    </nav>
  </div>
</header>

<main id="main-content" class="doc-shell">
  <article class="doc-content">
    {{ content }}
  </article>
</main>

<footer class="site-footer">
  <div class="wrap footer-inner">
    <span>Static documentation generated and published by CI.</span>
    <a href="{{ '/' | relative_url }}">Back to dashboard</a>
  </div>
</footer>

<script src="{{ '/assets/theme.js' | relative_url }}" defer></script>
<script type="module">
  import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";

  const diagrams = [];
  document.querySelectorAll("pre").forEach((pre) => {
    const code = pre.querySelector("code");
    const classes = [
      pre.getAttribute("class") || "",
      code?.getAttribute("class") || "",
      pre.parentElement?.getAttribute("class") || "",
      pre.parentElement?.parentElement?.getAttribute("class") || ""
    ].join(" ");
    if (!classes.includes("language-mermaid")) {
      return;
    }

    const diagram = document.createElement("div");
    diagram.className = "mermaid";
    diagram.dataset.source = code ? code.textContent : pre.textContent;
    diagram.textContent = diagram.dataset.source;
    const wrapper = pre.closest(".language-mermaid") || pre;
    wrapper.replaceWith(diagram);
    diagrams.push(diagram);
  });

  async function renderDiagrams() {
    if (diagrams.length === 0) {
      return;
    }

    for (const diagram of diagrams) {
      diagram.removeAttribute("data-processed");
      diagram.textContent = diagram.dataset.source;
    }

    mermaid.initialize({
      startOnLoad: false,
      securityLevel: "strict",
      theme: document.documentElement.dataset.theme === "dark" ? "dark" : "default"
    });
    await mermaid.run({ nodes: diagrams });
  }

  await renderDiagrams();
  window.addEventListener("site-theme-change", renderDiagrams);
</script>
</body>
</html>
